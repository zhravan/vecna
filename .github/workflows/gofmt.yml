name: gofmt

on:
  push:

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'

      - name: Format tracked Go files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files -z -- '*.go')
          if ((${#files[@]})); then
            gofmt -w "${files[@]}"
          fi

      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- '*.go'; then
            echo "All tracked Go files are already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*.go'
          git commit -m "chore: gofmt"
          git push
